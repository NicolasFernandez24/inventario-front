<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-green-100">

  <div class="bg-white/80 backdrop-blur-xl shadow-xl border border-green-200 rounded-3xl p-10 w-full max-w-md">

    <!-- Título -->
    <h2 class="text-4xl font-extrabold text-green-700 text-center mb-3 tracking-tight">
      Sistema de Inventario
    </h2>

    <p class="text-green-600 text-center mb-10 text-sm">
      Acceda al sistema
    </p>

    <!-- Formulario -->
    <form (ngSubmit)="login()" class="space-y-6">

      <!-- Email -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Correo electrónico</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white focus:outline-none 
                 focus:ring-2 focus:ring-green-500 transition shadow-sm"
          placeholder="usuario@empresa.com"
        >
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white focus:outline-none 
                 focus:ring-2 focus:ring-green-500 transition shadow-sm"
          placeholder="••••••••"
        >
      </div>

      <!-- Error -->
      <div *ngIf="error" class="bg-red-100 text-red-700 px-4 py-2 rounded-xl text-sm text-center shadow">
        {{ error }}
      </div>

  <button
  type="submit"
  [disabled]="loading"
  class="w-full py-3 rounded-xl bg-green-600 text-white font-semibold shadow-md 
         hover:bg-green-700 active:scale-[0.98] transition-all 
         flex items-center justify-center gap-3 
         disabled:opacity-50 disabled:cursor-not-allowed"
>

  <!-- Texto SIEMPRE visible -->
  <span>{{ loading ? 'Procesando...' : 'Ingresar al sistema' }}</span>

  <!-- Ícono visible SOLO cuando no está cargando -->
  <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" 
       class="w-6 h-6" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7l7 7-7 7" />
  </svg>

</button>



    </form>

    <!-- Footer -->
    <p class="text-center text-gray-500 text-xs mt-8">
      © {{ year }} — Plataforma Empresarial
    </p>

  </div>
</div>
