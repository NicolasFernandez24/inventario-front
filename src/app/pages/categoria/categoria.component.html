<div class="min-h-screen flex bg-gray-100">

  <app-sidebar></app-sidebar>

  <main class="flex-1 p-8">

  <div class="bg-white shadow rounded-lg p-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-semibold text-gray-700">
        Categorías
      </h2>

      <button
        *ngIf="rol === 'admin'"
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition text-sm"
        (click)="abrirModalNueva()">
        ➕ Nueva categoría
      </button>
    </div>

    <!-- Buscador -->
    <input
      type="text"
      placeholder="Buscar por nombre..."
      [(ngModel)]="busqueda"
      class="mb-4 w-64 border rounded-lg px-3 py-2 text-sm"
    />

    <!-- Tabla -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-gray-700">
        <thead class="border-b bg-gray-50">
          <tr>
            <th class="text-left py-3 px-2">Nombre</th>
            <th class="text-left px-2">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let c of categoriasFiltradas"
            class="border-b hover:bg-gray-50 transition">

            <td class="py-3 px-2 font-medium">
              {{ c.nombre }}
            </td>

            <td class="px-2 space-x-4">
              <button
                *ngIf="rol === 'admin'"
                class="text-blue-600 hover:underline text-sm"
                (click)="abrirModalEditar(c)">
                Editar
              </button>

              <button
                *ngIf="rol === 'admin'"
                class="text-red-600 hover:underline text-sm"
                (click)="eliminar(c.id)">
                Eliminar
              </button>
            </td>
          </tr>

          <tr *ngIf="categorias.length === 0">
            <td colspan="2" class="py-8 text-center text-gray-500">
              No hay categorías registradas
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- MODAL -->
  <div
    *ngIf="modalAbierto"
    class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">

    <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-6">

      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold text-gray-700">
          {{ editando ? 'Editar categoría' : 'Nueva categoría' }}
        </h3>

        <button
          class="text-gray-400 hover:text-gray-600"
          (click)="cerrarModal()">
          ✕
        </button>
      </div>

      <label class="block mb-4">
        <span class="text-sm font-medium text-gray-600">Nombre</span>
        <input
          type="text"
          [(ngModel)]="categoria.nombre"
          class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"
        />
      </label>

      <div class="flex justify-end gap-3 mt-6">
        <button
          class="px-4 py-2 rounded-lg bg-gray-300 hover:bg-gray-400 text-sm"
          (click)="cerrarModal()">
          Cancelar
        </button>

        <button
          class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 text-sm"
          (click)="guardar()">
          Guardar
        </button>
      </div>

    </div>
  </div>

</main>

</div>
