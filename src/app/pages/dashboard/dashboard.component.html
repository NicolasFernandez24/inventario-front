<div class="min-h-screen flex bg-gray-100">

  <app-sidebar></app-sidebar>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 p-10">

    <h1 class="text-3xl font-bold text-gray-700 mb-8">
      Bienvenido, {{ user.nombre | uppercase }}
    </h1>

    <!-- Tarjetas del menú -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- CARD PRODUCTOS -->
      <div
        (click)="navigate('productos')"
        class="p-6 rounded-xl shadow bg-white relative transition"
        [ngClass]="{
          'cursor-pointer hover:shadow-lg hover:-translate-y-1 border border-green-400':
            hasPermission('productos'),
          'opacity-50 cursor-not-allowed': !hasPermission('productos')
        }"
      >
        <h3 class="text-xl font-semibold text-gray-700">Productos</h3>
        <p class="text-gray-500 mt-2">Gestión completa del inventario</p>
        <div *ngIf="!hasPermission('productos')" class="absolute top-3 right-3 text-gray-400">🔒</div>
      </div>

      <!-- CARD CATEGORIAS -->
      <div
        (click)="navigate('categorias')"
        class="p-6 rounded-xl shadow bg-white relative transition"
        [ngClass]="{
          'cursor-pointer hover:shadow-lg hover:-translate-y-1 border border-green-400':
            hasPermission('categorias'),
          'opacity-50 cursor-not-allowed': !hasPermission('categorias')
        }"
      >
        <h3 class="text-xl font-semibold text-gray-700">Categorías</h3>
        <p class="text-gray-500 mt-2">Clasificación de productos</p>
        <div *ngIf="!hasPermission('categorias')" class="absolute top-3 right-3 text-gray-400">🔒</div>
      </div>

      <!-- CARD PROVEEDORES -->
      <div
        (click)="navigate('proveedores')"
        class="p-6 rounded-xl shadow bg-white relative transition"
        [ngClass]="{
          'cursor-pointer hover:shadow-lg hover:-translate-y-1 border border-green-400':
            hasPermission('proveedores'),
          'opacity-50 cursor-not-allowed': !hasPermission('proveedores')
        }"
      >
        <h3 class="text-xl font-semibold text-gray-700">Proveedores</h3>
        <p class="text-gray-500 mt-2">Gestión de proveedores</p>
        <div *ngIf="!hasPermission('proveedores')" class="absolute top-3 right-3 text-gray-400">🔒</div>
      </div>

      <!-- CARD MOVIMIENTOS -->
      <div
        (click)="navigate('movimientos')"
        class="p-6 rounded-xl shadow bg-white relative transition"
        [ngClass]="{
          'cursor-pointer hover:shadow-lg hover:-translate-y-1 border border-green-400':
            hasPermission('movimientos'),
          'opacity-50 cursor-not-allowed': !hasPermission('movimientos')
        }"
      >
        <h3 class="text-xl font-semibold text-gray-700">Movimientos de Stock</h3>
        <p class="text-gray-500 mt-2">Entradas, salidas y auditoría</p>
        <div *ngIf="!hasPermission('movimientos')" class="absolute top-3 right-3 text-gray-400">🔒</div>
      </div>
<!-- CARD USUARIOS -->
<div
  (click)="navigate('usuarios')"
  class="p-6 rounded-xl shadow bg-white relative transition"
  [ngClass]="{
    'cursor-pointer hover:shadow-lg hover:-translate-y-1 border border-green-400':
      hasPermission('usuarios'),
    'opacity-50 cursor-not-allowed': !hasPermission('usuarios')
  }"
>
  <h3 class="text-xl font-semibold text-gray-700">Usuarios</h3>
  <p class="text-gray-500 mt-2">Gestión de administradores y empleados</p>
  <div *ngIf="!hasPermission('usuarios')" class="absolute top-3 right-3 text-gray-400">🔒</div>
</div>

    </div>

  </main>
</div>
