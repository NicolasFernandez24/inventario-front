 <!-- SIDEBAR -->
  <aside class="w-64 h-screen bg-white shadow-lg p-6 flex flex-col">


    <h2 class="text-2xl font-bold text-green-700 mb-8">Inventario</h2>

<div *ngIf="role === 'admin' && productosStockBajo.length > 0"
     class="mb-6 p-3 bg-red-100 border border-red-300 rounded-lg">

  <div
    class="flex justify-between items-center cursor-pointer"
    (click)="toggleAlertas()"
  >
    <span class="text-red-700 font-semibold text-sm">
      ⚠ Stock bajo ({{ productosStockBajo.length }})
    </span>

    <span class="text-red-700 text-xs">
      {{ mostrarAlertas ? '▲' : '▼' }}
    </span>
  </div>


  <ul *ngIf="mostrarAlertas"
      class="mt-3 text-sm text-red-700 space-y-1 max-h-40 overflow-auto">
    <li *ngFor="let p of productosStockBajo">
      • {{ p.nombre }} ({{ p.stock }} / mín {{ p.stock_minimo }})
    </li>
  </ul>

</div>

    <nav class="space-y-3">

      <!-- Productos -->
      <div
        (click)="hasPermission('productos') && navigate('productos')"
        class="p-3 rounded-lg flex items-center justify-between transition"
        [ngClass]="hasPermission('productos')
          ? 'bg-green-100 text-green-700 hover:bg-green-200 cursor-pointer'
          : 'bg-gray-100 text-gray-400 cursor-not-allowed'"
      >
        <span>Productos</span>
        <span *ngIf="!hasPermission('productos')">🔒</span>
      </div>

      <!-- Categorías -->
      <div
        (click)="hasPermission('categorias') && navigate('categorias')"
        class="p-3 rounded-lg flex items-center justify-between transition"
        [ngClass]="hasPermission('categorias')
          ? 'bg-green-100 text-green-700 hover:bg-green-200 cursor-pointer'
          : 'bg-gray-100 text-gray-400 cursor-not-allowed'"
      >
        <span>Categorías</span>
        <span *ngIf="!hasPermission('categorias')">🔒</span>
      </div>

      <!-- Proveedores -->
      <div
        (click)="hasPermission('proveedores') && navigate('proveedores')"
        class="p-3 rounded-lg flex items-center justify-between transition"
        [ngClass]="hasPermission('proveedores')
          ? 'bg-green-100 text-green-700 hover:bg-green-200 cursor-pointer'
          : 'bg-gray-100 text-gray-400 cursor-not-allowed'"
      >
        <span>Proveedores</span>
        <span *ngIf="!hasPermission('proveedores')">🔒</span>
      </div>

      <!-- Movimientos -->
      <div
        (click)="hasPermission('movimientos') && navigate('movimientos')"
        class="p-3 rounded-lg flex items-center justify-between transition"
        [ngClass]="hasPermission('movimientos')
          ? 'bg-green-100 text-green-700 hover:bg-green-200 cursor-pointer'
          : 'bg-gray-100 text-gray-400 cursor-not-allowed'"
      >
        <span>Movimientos de Stock</span>
        <span *ngIf="!hasPermission('movimientos')">🔒</span>
      </div>

      <!-- Usuarios -->
      <div
        (click)="hasPermission('usuarios') && navigate('usuarios')"
        class="p-3 rounded-lg flex items-center justify-between transition"
        [ngClass]="hasPermission('usuarios')
          ? 'bg-green-100 text-green-700 hover:bg-green-200 cursor-pointer'
          : 'bg-gray-100 text-gray-400 cursor-not-allowed'"
      >
        <span>Usuarios</span>
        <span *ngIf="!hasPermission('usuarios')">🔒</span>
      </div>

    </nav>

    <button
      (click)="logout()"
      class="mt-10 w-full py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition"
    >
      Cerrar sesión
    </button>

  </aside>
